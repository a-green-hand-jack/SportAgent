[project]
name = "fitness-agent"
version = "0.1.0"
description = "AI-powered personalized fitness planning system (V1 — Static Planning)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "jieke"}
]
dependencies = [
    # LLM providers
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    # Data handling
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    # CLI
    "typer>=0.13.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[project.scripts]
fitness-agent = "fitness_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitness_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --cov=src/fitness_agent --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "black>=26.1.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.2",
]
